project:
  type: book
  output-dir: _book

book:
  title: "Titre du rapport"
  subtitle: "Sous-titre du rapport"
  author: "Auteur"
  date: today
  date-format: long
  chapters:
    - index.qmd
  # logo et favicon : lus dans l'extension, pas copiés dans le livre
  favicon: _extensions/kbosirany/inrae/favicon-inrae.png
  sidebar:
    logo: _extensions/kbosirany/inrae/logo-inrae.png
    style: docked
  page-footer:
    left: "INRAE"
    right: "Rapport rédigé avec [Quarto](https://quarto.org)"
  # icône « Download PDF » de la version HTML
  downloads: [pdf]

bibliography: references.bib
link-citations: true

format:
  inrae-html: default
  inrae-typst: default
  # PDF avec LaTeX à la place de Typst :
  # inrae-pdf: default
